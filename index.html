function buildPieChartHTML(labels, values) {
var total = values.reduce(function(a, b) { return a + (b || 0); }, 0);
if (total <= 0) return 'Nessun dato positivo da mostrare nel grafico a torta.';
var size = 136;
var cx = size / 2, cy = size / 2, r = 54, innerR = 30;
var startAngle = -Math.PI / 2;
var svg = '';
var legend = '';
var activeItems = [];
for (var i = 0; i < labels.length; i++) {
if ((values[i] || 0) > 0) {
activeItems.push({ label: labels[i], val: values[i], color: PIE_COLORS[i % PIE_COLORS.length] });
}
}
if (activeItems.length === 1) {
var item = activeItems[0];
svg += '';
svg += '';
legend += '' + item.label + '100% (' + fmtShort(item.val) + ')';
} else {
activeItems.forEach(function(item) {
var slice = (item.val / total) * Math.PI * 2;
var endAngle = startAngle + slice;
var x1 = cx + r * Math.cos(startAngle);
var y1 = cy + r * Math.sin(startAngle);
var x2 = cx + r * Math.cos(endAngle);
var y2 = cy + r * Math.sin(endAngle);
var ix1 = cx + innerR * Math.cos(endAngle);
var iy1 = cy + innerR * Math.sin(endAngle);
var ix2 = cx + innerR * Math.cos(startAngle);
var iy2 = cy + innerR * Math.sin(startAngle);
var largeArc = slice > Math.PI ? 1 : 0;
var d = 'M ' + x1.toFixed(2) + ' ' + y1.toFixed(2) +
' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2) +
' L ' + ix1.toFixed(2) + ' ' + iy1.toFixed(2) +
' A ' + innerR + ' ' + innerR + ' 0 ' + largeArc + ' 0 ' + ix2.toFixed(2) + ' ' + iy2.toFixed(2) + ' Z';
svg += '';
startAngle = endAngle;
var pct = Math.round((item.val / total) * 100);
legend += '' + item.label + '' + pct + '% (' + fmtShort(item.val) + ')';
});
}
svg += '';
legend += '';
return '' + svg + legend + '';
}

function downloadFile(filename, content, mime) {

function importCsvText(text) {
var lines = text.split(/\r?\n/);
var imported = 0;
for (var i = 0; i < lines.length; i++) {
var line = lines[i].trim();
if (!line) continue;
var sep = line.indexOf(';') !== -1 ? ';' : ',';
var parts = line.split(sep).map(function(p) { return p.trim().replace(/^"|"$/g, ''); });
if (parts.length < 3) continue;
var yr = parseInt(parts[0], 10);
if (isNaN(yr) || yr < 1900 || yr > 2100) continue;
var mRaw = parts[1].toLowerCase();
var mIdx = -1;
var mNum = parseInt(mRaw, 10);
if (!isNaN(mNum) && mNum >= 1 && mNum <= 12) {
mIdx = mNum - 1;
} else {
for (var m = 0; m < 12; m++) {
if (MONTHS[m].toLowerCase().indexOf(mRaw) === 0 || mRaw.indexOf(MONTHS[m].toLowerCase()) === 0) {
mIdx = m;
break;
}
}
}
if (mIdx === -1) continue;
var val = parseNumberInput(parts[2]);
if (isNaN(val)) continue;
if (!state.monthly[yr]) state.monthly[yr] =;
state.monthly[yr][mIdx] = val;
currentYear = yr;
imported++;
}
if (imported > 0) {
saveState();
syncYearDropdown();
renderDashboard();
renderStorico();
showToast('Importati ' + imported + ' mesi con successo');
} else {
showToast('Nessuna riga valida trovata nel CSV');
}
}
